<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>弹窗白色主题预览</title>
  <style>
    body {
      margin: 0;
      padding: 28px;
      background: #eef1f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #1f232b;
    }
    h1 { font-size: 18px; margin: 0 0 6px; }
    p { margin: 0 0 20px; color: #6b7280; font-size: 13px; }
    .stage {
      display: flex;
      flex-wrap: wrap;
      gap: 28px;
      align-items: flex-start;
    }
    .frame {
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 12px 34px rgba(31, 35, 43, .18);
      border: 1px solid #d8dee7;
      background: #fff;
    }
    .frame.light { outline: 3px solid #dbe4f5; }
    .frame.dark { outline: 3px solid #2b3040; background: #1b1e26; }
    .label { font-size: 12px; color: #6b7280; margin-top: 8px; text-align: center; }
    iframe {
      display: block;
      width: 400px;
      height: 640px;
      border: 0;
      background: #fff;
    }
    .note { margin-top: 22px; font-size: 12px; color: #6b7280; line-height: 1.7; }
    code { background: #e3e8f2; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Bookmark Sync · 弹窗白色主题预览</h1>
  <p>底色已改为纯白 <code>#ffffff</code>，面板/输入框/卡片为白与浅灰，文字为深灰，主色渐变保持不变。</p>
  <div class="stage">
    <div>
      <div class="frame light"><iframe src="dist/universal/popup.html" title="弹窗预览（浅色浏览器背景）"></iframe></div>
      <div class="label">浅色浏览器工具栏 / 浅色背景</div>
    </div>
    <div>
      <div class="frame dark"><iframe src="dist/universal/popup.html" title="弹窗预览（深色浏览器背景）"></iframe></div>
      <div class="label">深色浏览器工具栏 / 深色背景（弹窗仍为白底）</div>
    </div>
  </div>
  <div class="note">
    说明：弹窗背景与浏览器主题解耦，始终为白色；状态图标使用 <code>currentColor</code>，随语义色（成功绿 / 警告橙 / 错误红 / 变更蓝）变化。iframe 内的脚本因缺少扩展 API 会停在初始状态，不影响配色展示。
  </div>
</body>
</html>
