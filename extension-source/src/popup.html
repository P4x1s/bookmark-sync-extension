<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmark Sync</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 18h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.2 8.3 4 4 0 0 0 7 18Z"/>
          <path d="M9.5 13.5 12 11l2.5 2.5M12 11v6"/>
        </svg>
      </span>
      <div>
        <div class="brand-title">Bookmark Sync</div>
        <div class="brand-sub">GitHub 私人仓库双向同步</div>
      </div>
    </div>
    <span class="version">v0.3.2</span>
  </div>

  <div id="statusCard" class="status-card idle">
    <div class="status-glyph" id="statusGlyph">○</div>
    <div class="status-body">
      <div class="status-title" id="statusTitle">正在读取状态</div>
      <div class="status-detail" id="statusDetail"></div>
      <div class="status-meta" id="statusMeta"></div>
    </div>
  </div>

  <div id="conflictBox" class="notice hidden">
    <div class="notice-title">检测到双向冲突</div>
    <div class="notice-sub">选择一种处理方式，操作前都会保留备份。</div>
    <div class="row gap">
      <button id="btnUseLocal" class="btn btn-warn" type="button">备份远端 · 保留本地</button>
      <button id="btnUseRemote" class="btn btn-warn" type="button">备份本地 · 采用远端</button>
    </div>
  </div>

  <section class="card">
    <h2>仓库连接</h2>
    <div class="row gap">
      <label class="grow">用户名 / 组织
        <input id="owner" type="text" placeholder="P4x1s" autocomplete="off" spellcheck="false">
      </label>
      <label class="grow">仓库名（Private）
        <input id="repo" type="text" placeholder="bookmark-sync-vault" autocomplete="off" spellcheck="false">
      </label>
    </div>
    <div class="row gap">
      <label class="grow">分支
        <input id="branch" type="text" placeholder="main" autocomplete="off" spellcheck="false">
      </label>
      <label class="grow">同步文件
        <input id="path" type="text" placeholder="bookmarks.json" autocomplete="off" spellcheck="false">
      </label>
    </div>
    <label>Personal Access Token
      <span class="token-row">
        <input id="token" type="password" placeholder="ghp_…（classic PAT，repo 权限）" autocomplete="off" spellcheck="false">
        <button id="btnToggleToken" class="btn btn-icon" type="button" aria-label="显示或隐藏令牌">显示</button>
      </span>
    </label>
    <p class="hint">令牌仅保存在本扩展的本地存储。仓库中已有文件不会删除，首次写入前会备份原内容。</p>
  </section>

  <section class="card">
    <h2>同步行为</h2>
    <label class="switchline">
      <span>自动同步<small>书签变化时去抖同步，并按间隔轮询远端</small></span>
      <input id="autoSync" type="checkbox">
    </label>
    <label class="switchline">
      <span>低内存模式<small>本地快照只留 1 份，常规运行不载入完整树</small></span>
      <input id="lowMemoryMode" type="checkbox">
    </label>
    <div class="row gap">
      <label class="grow">轮询间隔（分钟）
        <input id="syncIntervalMinutes" type="number" min="1" max="1440" step="1">
      </label>
      <label class="grow">冲突策略
        <select id="conflictStrategy">
          <option value="backup-then-local">备份远端 · 保留本地</option>
          <option value="prefer-remote">备份本地 · 采用远端</option>
        </select>
      </label>
    </div>
    <label class="compact">本地备份份数（关闭低内存模式时生效）
      <input id="backupCount" type="number" min="1" max="5" step="1">
    </label>
  </section>

  <div class="actions">
    <button id="btnSave" class="btn btn-ghost" type="button">保存配置</button>
    <button id="btnTest" class="btn btn-ghost" type="button">测试连接</button>
    <button id="btnSync" class="btn btn-primary" type="button">立即同步</button>
  </div>

  <section class="card backups">
    <div class="section-head">
      <h2>本地快照</h2>
      <button id="btnOpenBackups" class="link" type="button">查看仓库备份</button>
    </div>
    <div id="backupList" class="backup-list">
      <div class="empty">暂无本地快照</div>
    </div>
  </section>

  <div id="toast" class="toast hidden" role="status"></div>
  <div class="footer">事件驱动状态更新 · 无后台轮询 · 快照按需读取</div>

  <script src="lib/util.js"></script>
  <script src="lib/api.js"></script>
  <script src="lib/config.js"></script>
  <script src="lib/github.js"></script>
  <script src="lib/model.js"></script>
  <script src="lib/sync.js"></script>
  <script src="popup.js"></script>
</body>
</html>
